<!DOCTYPE html>
<html lang="pl" data-theme="dojo" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ninja 10</title>
<link rel="stylesheet" href="lib/daisyui.css">
<link rel="stylesheet" href="lib/daisyui-themes.css">
<link rel="stylesheet" href="theme-milioni.css">
<script src="lib/tailwind.js"></script>
<script src="sim-bridge.js"></script>
<style type="text/tailwindcss">
  /* Register daisyUI colours with Tailwind, otherwise opacity variants like text-base-content/60 do not exist.
     Keep this block first; an @apply of an unknown class stops ALL Tailwind on the page. */
  @theme reference {
    --color-base-100: var(--color-base-100); --color-base-200: var(--color-base-200); --color-base-300: var(--color-base-300);
    --color-base-content: var(--color-base-content);
    --color-primary: var(--color-primary); --color-primary-content: var(--color-primary-content);
    --color-secondary: var(--color-secondary); --color-secondary-content: var(--color-secondary-content);
    --color-accent: var(--color-accent); --color-accent-content: var(--color-accent-content);
    --color-neutral: var(--color-neutral); --color-neutral-content: var(--color-neutral-content);
    --color-info: var(--color-info); --color-success: var(--color-success);
    --color-warning: var(--color-warning); --color-error: var(--color-error);
  }
  /* Screens: exactly one visible at a time */
  #app > section { display: none; }
  #app > section.on { display: flex; }
  /* print screen: the real A4 sheet (794 × 1123 px = 210 × 297 mm) scaled into #prPv — page 1 shows, both print */
  #prPv { position: relative; overflow: hidden; border-radius: 4px; background: #fff; box-shadow: 0 3px 14px rgba(0,0,0,.5); flex: none; }
  #prPv iframe { position: absolute; left: 0; top: 0; width: 794px; height: 1123px; border: 0; transform-origin: 0 0; pointer-events: none; }

  /* Friends table: 5 columns x 2 rows, column k = the pair k | 10−k (1|9 … 5|5).
     Only the pair being talked about shows its numbers; every other cell stays empty (Lasha 2026-10-25:
     the ninja takes different friends on each job). .a / .b = the friend's colour, as in the equation.
     Unlayered CSS beats Tailwind's .hidden, so hide the table's wrapper, never the table itself. */
  .tf { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: min(78vw, 300px); }
  .tf > i { aspect-ratio: 1; border-radius: 10px; border: 2px solid var(--color-base-300);
            display: flex; align-items: center; justify-content: center;
            font-style: normal; font-weight: 700; font-size: 1.9rem; }
  .tf > i.a { color: var(--color-primary); border-color: var(--color-primary); }
  .tf > i.b { color: var(--color-accent); border-color: var(--color-accent); }
  .ca { color: var(--color-primary); }
  .cb { color: var(--color-accent); }
  /* Theme swatch: the inner .sw carries data-theme, so its dots are painted in that theme;
     the outer button stays in the page theme and draws the "current" ring.
     6 themes = two rows of 3: 34 px each (was 3rem, spilling over its 40 px button) — two rows of the old size made ⚙️
     scroll by 10 px on a 360 × 750 phone (Lasha 2026-10-27, picked „ა"). */
  .swb { border-radius: 14px; padding: 0; height: 34px; }
  .swb.cur { outline: 3px solid var(--color-primary); outline-offset: 2px; }
  .sw { display: flex; gap: 4px; justify-content: center; align-items: center; height: 100%; border-radius: 12px;
        background: var(--color-base-100); border: 2px solid var(--color-base-300); }
  .sw > i { width: 14px; height: 14px; border-radius: 50%; }
  /* the empty slot the child fills in; .full = the answer in it, the line hidden but its 5 px kept (no jump) */
  .slot { display: inline-block; min-width: 1.1em; border-bottom: 5px solid currentColor; text-align: center; }
  .slot.full { border-bottom-color: transparent; }
  /* „Większe, mniejsze, równe": the empty circle between the two sides, the sign goes in it; .full = the sign in it,
     the ring hidden but its size kept (no jump). The card is a little smaller (#dQ.cmpq): „10 − 3 ◯ 10 − 4" is wider
     than any other card and must fit a 360 px phone */
  .cmpo { display: inline-flex; align-items: center; justify-content: center; width: 1.2em; height: 1.2em; margin: 0 .1em;
          border: 5px solid currentColor; border-radius: 50%; line-height: 1; }
  .cmpo.full { border-color: transparent; }
  #dQ.cmpq { font-size: 2.5rem; line-height: 1.2; }
  /* „< = >" within 20 „20 − 15 ◯ 10 + 10" has two digits more than „10 − 3 ◯ 10 − 4": smaller again (Lasha 2026-10-27,
     „both numbers up to 20" over „the second one a digit") */
  #dQ.cmpq.c20q { font-size: 2rem; }
  /* the long chains within 20 „18 − 7 + 9 = ▢▢" are one size smaller (text-4xl), on the card and on the wrong-answer
     sheet: at text-5xl they were 359 px on a 360 px phone (Lasha „კი", 2026-10-26). The pinned hint is in em, so it
     follows. „Within 1000"'s cards too: „1000 − 300 = ▢00" has three digits more than „100 − 30 = ▢0" (est. ~300 px
     at text-5xl) */
  #dQ.l20q, #dEq.l20q { font-size: 2.25rem; line-height: 2.5rem; }
  /* „Ile jeszcze odjąć?" „13 − 5 = 13 − 3 − ▢" (Lasha 2026-10-27) is wider still (est. ~300 px at 2 rem, not measured):
     2 rem on the card and the sheet, one step smaller in the „?" window (its box is narrower than the drill's column) */
  #dQ.s20q, #dEq.s20q { font-size: 2rem; line-height: 2.5rem; }
  #raEq.s20q { font-size: 1.875rem; }
  /* within 1000's „520 − 50 = 520 − 20 − ▢0" has five characters more again (est. ~380 px at 2 rem, not measured) */
  #dQ.s20q.l20q, #dEq.s20q.l20q { font-size: 1.625rem; }
  #raEq.s20q.l20q { font-size: 1.5rem; }
  /* the exam's wrong answer: no sheet, no right answer — the card shakes once in red */
  .xNo { color: var(--color-error); animation: xNo .45s; }
  @keyframes xNo { 0%, 100% { transform: none; } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
                   60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
  /* „+75" after a correct answer pops up next to the feedback line */
  .pop { display: inline-block; animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: translateY(10px) scale(.5); opacity: 0; } 40% { transform: translateY(-4px) scale(1.2); opacity: 1; }
                   100% { transform: none; opacity: 1; } }
  /* home: the child's name on a ribbon at the ninja's feet, in the ninja's own sticker style (dark outline, white
     border) and its headband colour — set in drawName() (Lasha picked „C · name sticker" 2026-10-25).
     A tap opens ⚙️, where the name changes (Lasha 2026-10-25); it gives a little under the finger like a .btn */
  .tag { display: inline-block; max-width: 100%; padding: 4px 18px; border-radius: 14px; border: 3px solid #1d1b2e;
         box-shadow: 0 0 0 3.5px #fff, 0 4px 0 3.5px rgba(0,0,0,.25); color: #fff; font-weight: 800;
         text-shadow: 0 2px 0 rgba(0,0,0,.25); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
         transform: rotate(-3deg); transition: transform .1s; }
  .tag:active { transform: rotate(-3deg) scale(.94); }
  /* result screen (Lasha picked „A · two tiles" 2026-10-25): „now" | „record". #res gets .rBeat the moment the
     counting score passes the OLD record (a first record: when the count ends) → the old number is struck out and
     dims, „now" lights up, the gold sticker pops, throwing stars fly out of „now". */
  .tag.gold { background: var(--color-warning); color: var(--color-warning-content); text-shadow: none; }
  .tag.rPop { transform: scale(0) rotate(-3deg); }
  #res.rBeat .tag.rPop { animation: recPop .5s cubic-bezier(.3, 1.7, .5, 1) forwards; }
  @keyframes recPop { 0% { transform: scale(0) rotate(-3deg); } 100% { transform: scale(1) rotate(-3deg); } }
  .rStrike { position: relative; display: inline-block; }
  .rStrike::after { content: ""; position: absolute; left: -8%; top: 50%; height: 5px; width: 0; border-radius: 3px;
                    background: var(--color-warning); transform: rotate(-14deg); transform-origin: left; transition: width .35s ease-out; }
  #res.rBeat .rStrike::after { width: 116%; }
  .rOld { transition: opacity .4s; }
  #res.rBeat .rOld { opacity: .5; }
  .rGlow { transition: box-shadow .4s, border-color .4s; }
  #res.rBeat .rGlow { border-color: var(--color-warning);
                      box-shadow: 0 0 0 3px var(--color-warning), 0 0 26px color-mix(in oklab, var(--color-warning) 55%, transparent); }
  .rBs { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; pointer-events: none; z-index: 20;
         animation: recBs .95s ease-out forwards; }
  .rBs svg { width: 100%; height: 100%; display: block; }
  @keyframes recBs { 0% { transform: translate(0, 0) rotate(0) scale(.3); opacity: 1; }
                     100% { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1); opacity: 0; } }

  /* Wrong answer: a sheet slides up over the keypad and lands with a small bounce; „next" slides it back down
     (Lasha picked „A · sheet from below" 2026-10-25). Plain base colours — the only red is the small X beside
     the child's number (a red window was „too red, scary"; no strike-through). Inside: the circle pops and
     shakes „no", the X pops, then the right pair pops in one friend at a time. */
  .win { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: none; text-align: center;
         padding: 46px 16px 22px; border-radius: 28px 28px 0 0;
         border: 2px solid var(--color-base-300); border-bottom: 0; background: var(--color-base-200);
         box-shadow: 0 -4px 20px #0004; }
  .win.on { display: block; animation: winIn .55s cubic-bezier(.3, 1.3, .6, 1) both; }
  .win.on.off { animation: winOut .3s ease-in both; }
  .win.on.off * { animation: none !important; }
  .win .tf { margin: 0 auto 16px; }
  .wb { position: absolute; left: 50%; top: 0; width: 64px; height: 64px; border-radius: 50%; transform: translate(-50%, -50%);
        display: grid; place-items: center; font-size: 32px; font-weight: 800; color: var(--color-base-content);
        background: var(--color-base-100); border: 3px solid var(--color-base-300); box-shadow: 0 4px 12px #0004; }
  .wn { line-height: 1; }
  .wx { position: absolute; right: -22px; top: -2px; width: 22px; height: 22px; }
  .wx::before, .wx::after { content: ""; position: absolute; left: 0; top: 9px; width: 22px; height: 5px; border-radius: 3px;
                            background: var(--color-error); }
  .wx::before { transform: rotate(45deg); }
  .wx::after { transform: rotate(-45deg); }
  .win.on .wb { animation: wbPop .45s .3s cubic-bezier(.3, 1.6, .6, 1) both, wbNo .45s .7s ease; }
  .win.on .wx { animation: xPop .35s .7s cubic-bezier(.3, 1.6, .6, 1) both; }
  .win.on .tf > i.a { animation: cellPop .4s .45s cubic-bezier(.3, 1.6, .6, 1) both; }
  .win.on .tf > i.b { animation: cellPop .4s .6s cubic-bezier(.3, 1.6, .6, 1) both; }
  /* the plain drill's sheet: the right sum instead of the table, popping in where the pair would */
  .weq { margin: 0 0 16px; }
  /* step 5's sheet: „38 − 20 = 18" / „18 − 1 = 17" in a grid (the numbers line up), row 1 pops in at 1 s, row 2 at 2 s
     (Lasha picked speed 1 of three, 2026-10-27) — counted from the sheet opening, so they start over with it */
  .stp { display: grid; grid-template-columns: repeat(5, auto); justify-content: center; column-gap: .3em; row-gap: .15em;
         font-size: 1.875rem; line-height: 2.25rem; font-weight: 700; white-space: nowrap; }
  .stp > * { text-align: right; }
  .stp .p { color: var(--color-primary); } .stp .a { color: var(--color-accent); }
  .win.on .stp > * { animation: rowIn .45s 1s cubic-bezier(.3, 1.5, .6, 1) both; }
  .win.on .stp > .r2 { animation-delay: 2s; }
  @keyframes rowIn { from { opacity: 0; transform: translateY(14px) scale(.7); } to { opacity: 1; transform: none; } }
  .win.on .weq { animation: cellPop .4s .45s cubic-bezier(.3, 1.6, .6, 1) both; }
  /* plain „2 + 7" (the small one first): the easy order „7 + 2" under the task, in a dashed warning-colour frame
     (Lasha picked „B · hint below" in swap.tmp.html, 2026-10-25) — there at once with the card, and pale */
  .swh, .pin .fst::after { display: inline-block; padding: 2px 16px; border-radius: 14px; border: 3px dashed var(--color-warning);
         color: var(--color-warning); opacity: .45; }
  /* the long drill: the same frame with the chain's first step „3 + 2", right under that step, not centred
     (Lasha 2026-10-26). A ::after, so the hint is no part of the card's text (the answer log reads it). Sized in em
     of the card: under the drill's text-5xl it is text-3xl 1 rem below; ⚙️'s example window draws it smaller */
  .pin .fst { position: relative; }
  .pin .fst::after { content: attr(data-h); position: absolute; left: 50%; top: calc(100% + .53em);
                     transform: translateX(-50%); font-size: .625em; line-height: 1.2; }
  /* „Przez 10" (+ and −): the second number splits into two branches — „7" → 5 and 2 (Lasha picked C in
     hint3.tmp.html, 2026-10-26; „5 + 2" under a subtraction confused, „5 potem 2" was too long). No frame: the
     branches are two gradient strokes along the ::after's top, the two parts justified to its edges under them —
     still a pseudo-element, so the card's text stays clean */
  .pin .fst.tr::after { top: 100%; width: 2em; padding: .8em 0 0; border: 0; border-radius: 0; opacity: .6;
    white-space: normal; text-align: justify; text-align-last: justify;
    --br: transparent calc(50% - 2.5px), var(--color-warning) calc(50% - 1.5px), var(--color-warning) calc(50% + 1.5px),
          transparent calc(50% + 2.5px);
    background: linear-gradient(to top left, var(--br)) left .3em top .1em / calc(50% - .3em) .65em no-repeat,
                linear-gradient(to top right, var(--br)) right .3em top .1em / calc(50% - .3em) .65em no-repeat; }
  /* „Przez 10"'s wrong-answer sheet: the solved card keeps its hint under the 8 — room for it above „Dalej" */
  .weq.pin { margin-bottom: 2em; }
  /* „Przez 10"'s wrong-answer sheet: the number line from the rule-5 demo (rule5.tmp.html) — two jumps drawn in turn,
     a → 10 (primary) → the sum (accent), the end number showing when jump 2 lands */
  .nl { --d: .2s; display: block; max-width: 100%; height: auto; margin: 0 auto; color: var(--color-base-content); }
  .win .nl { --d: .6s; margin-bottom: 16px; }
  .nl text { font-weight: 700; text-anchor: middle; fill: currentColor; }
  .nl text.mid { opacity: .55; }
  .nl .tk { stroke: currentColor; stroke-width: 2; opacity: .35; }
  .nl .ax { stroke: currentColor; stroke-width: 3; opacity: .45; stroke-linecap: round; }
  .nl .dt { fill: currentColor; }
  .nl .j { fill: none; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; }
  .nl .j1 { stroke: var(--color-primary); animation: nlDraw .45s var(--d) ease-out both; }
  .nl .j2 { stroke: var(--color-accent); animation: nlDraw .45s calc(var(--d) + .7s) ease-out both; }
  .nl .l1 { fill: var(--color-primary); animation: nlFade .25s calc(var(--d) + .3s) both; }
  .nl .l2 { fill: var(--color-accent); animation: nlFade .25s calc(var(--d) + 1s) both; }
  .nl .ten { fill: var(--color-primary); }
  .nl .end { fill: var(--color-accent); animation: nlFade .25s calc(var(--d) + 1.1s) both; }
  @keyframes nlDraw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes nlFade { from { opacity: 0; } to { opacity: 1; } }
  /* „W zakresie 20" — the „10" scene (Lasha picked C2 in anim10.tmp.html, 2026-10-26): the ninja „10" = two big digits
     in the suit colour with a white outline, the headband a stripe through them — a whole 10 on its own. The friend's
     digit (accent) sits on the „0" on a patch of the screen's own background (--seat), so the „0" stays under it. */
  .tst { position: relative; height: 128px; overflow: hidden; flex: none; }
  .tst > * { position: absolute; top: 0; height: 128px; font: 900 112px/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .n10 { left: calc(50% - 96px); width: 192px; }
  .n10 > * { position: absolute; top: 0; width: 80px; height: 128px; display: flex; align-items: center; justify-content: center;
             text-decoration: none; color: transparent;
             background: linear-gradient(#2b2a3f 31%, var(--band) 31% 42%, #2b2a3f 42%); -webkit-background-clip: text; background-clip: text;
             filter: drop-shadow(3px 0 #fff) drop-shadow(-3px 0 #fff) drop-shadow(0 3px #fff) drop-shadow(0 -3px #fff); }
  .n10 b { left: 20px; } .n10 u { left: 92px; }
  .dg { left: calc(50% - 4px); width: 80px; display: flex; align-items: center; justify-content: center;
        background: var(--seat, var(--color-base-100)); color: var(--color-accent); }
  .win { --seat: var(--color-base-200); }
  /* the two answer slots of „10 + 3 = ▢▢": one digit wide each, so the answer reads „13", not „1 3"; a small gap
     keeps the two lines apart */
  .tans > .slot { min-width: .62em; margin: 0 .04em; }
  .p0 { font-style: normal; opacity: .3; }   /* the pale „0" the „10" key leaves for the next digit to cover */
  .slot.fill { animation: cellPop .3s cubic-bezier(.3, 1.6, .6, 1) both; }
  #pad { transition: opacity .25s; }
  /* the keys' height follows the screen's: 64px from an 800px-tall screen up, down to 48px on a small one (Lasha
     2026-10-27, 360×640: „the keys are too tall"); the „> = <" keys the same way, 96px down to 64px */
  #pad .pd { height: clamp(48px, 8vh, 64px); }
  #pad .ps { height: clamp(64px, 12vh, 96px); }
  /* the ninja's head on the „10" key, peeking over its top-right corner (Lasha picked B in key10.tmp.html) */
  #pad10 .nc { position: absolute; top: -14px; right: -8px; transform: rotate(12deg); pointer-events: none; }
  #pad.dim { opacity: .2; pointer-events: none; }
  /* a drill's „?" in the menus: a faint „?" inside its button's top-right corner, no circle — the white circles half
     outside the corners stood out too much (Lasha 2026-10-26, picked B) */
  .hq { position: absolute; top: 2px; right: 2px; z-index: 2; }
  /* a drill's menu button (.rec): its name above, the record on a darker band along the bottom — „🏆 640" left,
     ☆ → ⭐ right once memorized (Lasha picked „E" in records.tmp.html, 2026-10-26; was „🏆 Rekord: 640 · ✓").
     The band is painted from the button's text colour, so it reads on every theme. .big = the exam */
  .btn.rec { padding: 0; gap: 0; overflow: hidden; align-items: stretch; }
  .rec .nm { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px 6px 6px; }
  .rec .ft { display: flex; justify-content: space-between; align-items: center; padding: 3px 10px;
             font-size: .78rem; font-weight: 800; background: color-mix(in oklab, var(--color-primary-content) 16%, transparent); }
  .rec .ft .no { margin: 0 auto; font-weight: 400; opacity: .8; }
  .rec .ft .st0 { opacity: .55; font-size: .95rem; line-height: 1; }
  .rec.big .nm { padding-top: 18px; }
  .rec.big .ft { font-size: 1rem; padding: 5px 14px; }
  /* the „?" window's solved card: room under it for the hint that hangs below (.pin .fst::after) */
  #raEq.pin { margin-bottom: 1.9em; }
  /* the drill's pause window: an opaque screen behind it, not the usual see-through dim — the card must not show */
  #pauseAsk[open] { background-color: var(--color-base-100); }
  /* a „< = >" card shows only the three signs (.ps), any other card only the digits (.pd) */
  #pad.cmp .pd, #pad:not(.cmp) .ps { display: none; }
  /* „Trudny egzamin" (card.rnd): no „10" key — every digit typed, „0" takes the whole bottom row */
  #pad.no10 #pad10 { display: none; }
  #pad.no10 .pd[data-n="0"] { grid-column: span 6 / span 6; }
  @keyframes winIn { from { transform: translateY(105%); } to { transform: none; } }
  @keyframes winOut { from { transform: none; } to { transform: translateY(105%); } }
  @keyframes wbPop { 0% { transform: translate(-50%, -50%) scale(0) rotate(-35deg); }
                     70% { transform: translate(-50%, -50%) scale(1.15) rotate(6deg); }
                     100% { transform: translate(-50%, -50%) scale(1); } }
  @keyframes wbNo { 0%, 100% { transform: translate(-50%, -50%); } 20% { transform: translate(calc(-50% - 7px), -50%); }
                    40% { transform: translate(calc(-50% + 7px), -50%); } 60% { transform: translate(calc(-50% - 4px), -50%); }
                    80% { transform: translate(calc(-50% + 4px), -50%); } }
  @keyframes xPop { 0% { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.25) rotate(8deg); } 100% { transform: scale(1); } }
  @keyframes cellPop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }

  /* ---------- „dojo" (Lasha picked „A · night dojo", pastel, in kids-theme.tmp.html, 2026-10-27: „the app looks like an
     Excel sheet"). The theme's colours are in theme-milioni.css; here: the starry sky behind every screen, and on home +
     the five topic menus the chunky pastel buttons — rounded, each its own colour (one hue per button at the same
     lightness, so they stay one family), a darker edge under it that a tap pushes it down onto. A drill's colour comes
     from its place in the grid (the same eight in the same order in every menu); an exam (any .rec outside the drill
     grid) is pastel gold. Only this theme: the other five keep their look. ---------- */
  [data-theme=dojo] body {
    background:
      radial-gradient(circle at 12% 14%, rgb(255 255 255 / .85) 0 1.4px, transparent 2px),
      radial-gradient(circle at 81% 8%, rgb(255 255 255 / .7) 0 1.2px, transparent 1.8px),
      radial-gradient(circle at 64% 22%, rgb(255 255 255 / .55) 0 1px, transparent 1.6px),
      radial-gradient(circle at 28% 36%, rgb(255 255 255 / .5) 0 1px, transparent 1.6px),
      radial-gradient(circle at 90% 41%, rgb(255 255 255 / .6) 0 1.3px, transparent 1.9px),
      radial-gradient(circle at 7% 58%, rgb(255 255 255 / .45) 0 1px, transparent 1.6px),
      radial-gradient(circle at 46% 6%, rgb(255 255 255 / .6) 0 1.1px, transparent 1.7px),
      radial-gradient(circle at 72% 63%, rgb(255 255 255 / .35) 0 1px, transparent 1.6px),
      radial-gradient(130% 90% at 50% 0%, #3b3184 0%, #211d52 50%, #14122f 100%);
  }
  [data-theme=dojo] #home .grid > .btn, [data-theme=dojo] #app .btn.rec {
    --btn-color: oklch(var(--L) var(--C) var(--h)); --btn-fg: #1d1b2e; --btn-border: #0000; --btn-inset: 0 0 0 0 #0000;

  [data-theme=dojo] #app .grid-cols-2 > :nth-child(8n+2) .rec { --h: 250; }   /* blue */
  [data-theme=dojo] #app .grid-cols-2 > :nth-child(8n+3) .rec { --h: 65; }    /* orange */
  [data-theme=dojo] #app .grid-cols-2 > :nth-child(8n+4) .rec { --h: 300; }   /* purple */
  [data-theme=dojo] #app .grid-cols-2 > :nth-child(8n+5) .rec { --h: 345; }   /* pink */
  [data-theme=dojo] #app .grid-cols-2 > :nth-child(8n+6) .rec { --h: 195; }   /* teal */
  [data-theme=dojo] #app .grid-cols-2 > :nth-child(8n+7) .rec { --h: 22; }    /* coral */
  [data-theme=dojo] #app .grid-cols-2 > :nth-child(8n+8) .rec { --h: 120; }   /* lime */
  /* home: within 10 green · within 20 blue · the twins pink · within 100 orange · within 1000 purple */
  [data-theme=dojo] #home #r1 { --h: 155; }  [data-theme=dojo] #home #r2 { --h: 250; }
  [data-theme=dojo] #home #r3 { --h: 345; }  [data-theme=dojo] #home #r4 { --h: 65; }

<body class="h-full m-0 bg-base-100 text-base-content">
  <main id="app" class="h-full max-w-3xl mx-auto">

    <!-- home: two topics, „within 10" and „within 20" (10 + a digit and back, Lasha 2026-10-26). The topic button plays
         the story by itself only the first time (S.story / S.storyTen); after that each opens its own menu („within 20"
         got one with „Przez 10", Lasha 2026-10-26). No „?" here any more: each drill has its own in the menus (Lasha
         2026-10-26: „on home it is too much") -->
    <section id="home" class="h-full flex-col p-5 gap-6">
      <div class="flex justify-end">
        <button id="toSet" class="btn btn-ghost btn-circle text-2xl">⚙️</button>

           „I don't like it, too high: lower it, a rounded rectangle" → picked „ბ" in trening.tmp.html): a soft tile like
           the result's „Teraz / Rekord", left of the ninja — the count on top in gold, the name under it. Shown only
           while the list has cards (renderHard). Absolute, so the ninja stays centred -->

      </div>
      <!-- the topics in a 2 × 2 grid (Lasha 2026-10-27: „home needs work — smaller buttons" → picked 2 × 2 over four
           thinner rows): within 10 | within 20 · the twins | within 100. The same height as the rows were; a long
           name wraps to two lines. Under them within 1000, one long button (Lasha 2026-10-27, „ა") -->

        <button id="r1" class="btn btn-primary h-auto min-h-20 py-4 text-xl" data-t="home_go"></button>

        <button id="r5" class="btn btn-primary h-auto min-h-20 py-4 text-xl col-span-2" data-t="home_go1000"></button>
      </div>
    </section>

    <!-- the topic's menu — the drills, each with its own record (Lasha 2026-10-25), and beside each drill a 🏆

      <!-- 🖨️ = the parent's print sheet, opposite ✕ (Lasha 2026-10-25) -->
      <!-- the topic's name beside ✕, as „Ustawienia" in ⚙️ (Lasha 2026-10-27: „titles are needed" — plain,

      </div>
      <!-- the five practice drills = small buttons, no 🏆 of their own: their records added up = one online list
           (the 🏆 above them); under them the exam = one big button with its own 🏆 (Lasha 2026-10-25).
           Each drill and the exam: its „?" (.hq, data-help = its mode) in the corner — a button cannot sit inside a

      function ten(op) { return [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (d) { return tenCard(op, d); }); }
      var cs = m === "ten" ? halves(ten("+"), ten("−"), n) : m === "cross" ? decks(crossAdds(), n)
             : m === "crossSub" ? decks(crossSubs(), n) : m === "crossMix" ? halves(crossAdds(), crossSubs(), n)
             : longChains(n, LONG20);
      return cs.map(function (c) {
        var q = c.ten ? (c.op === "+" ? "10 + " + c.d : (10 + c.d) + " − " + c.d)
              : c.long ? c.a + " " + c.op + " " + c.b + " " + c.op2 + " " + c.b2 : c.a + " " + c.op + " " + c.b;
        return { t: q + " = ▢", a: [c.want] };
      });
    }
    // the twins on paper (Lasha 2026-10-27): the app's own twinCard()s written out, no hint. Within 20 = half „+", half
    // „−" (10 a sign); within 50 one sign (15) — a big sheet deals deck after deck, as within 20
    function dealTw(m, n) {
      function pool(op, lo, hi) { for (var p = [], k = lo; k <= hi; k++) p.push(twinCard(op, k)); return p; }
      var cs = m === "twin20" ? halves(pool("+", 1, 10), pool("−", 1, 10), n)
             : decks(pool(m === "twinAdd50" ? "+" : "−", 11, 25), n);
      return cs.map(function (c) { return { t: c.a + " " + c.op + " " + c.b + " = ▢", a: [c.want] }; });
    }
    // „within 100" on paper (Lasha 2026-10-27, „1ბ"): the app's own pools written out, no hint, every answer a plain ▢
    // (the app's „▢0" is the keypad's). Half „+", half „−"; the fives and step 5 the easy half first, as in the app;
    // the friends' hidden side at random, card by card (as friendsDeal). Within 1000 (Lasha 2026-10-27) the same with
    // its own pools (× 10, k = 100) — a drill's mode ends in „1000"
    function deal100(m, n) {
      var big = /1000$/.test(m), k = big ? 100 : 10, F = big ? FIVES1000 : FIVES, S3 = big ? STEP3_1000 : STEP3,
          S4 = big ? STEP4_1000 : STEP4, S5 = big ? STEP5_1000 : STEP5;
      function line(c) { return { t: c.a + " " + c.op + " " + c.b + " = ▢", a: [c.want] }; }
      if (m === "split100" || m === "split1000") return decks(S4.s, n).map(function (c) { return splitLine(c, k); });
      // the hard exam: the app's own rnd100() / rnd1000(), a plain ▢
      if (m === "examHard100" || m === "examHard1000") return (big ? rnd1000 : rnd100)(n).map(line);
      var h = Math.ceil(n / 2);
      if (m === "friends100" || m === "friends1000") {
        var top = 10 * k,
            fr = function (op) { return [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (d) { return { op: op, a: k * d, b: top - k * d }; }); };
        return halves(fr("+"), fr("−"), n).map(function (c) {
          var hideA = Math.random() < 0.5;
          return c.op === "−" ? (hideA ? { t: top + " − ▢ = " + c.b, a: [c.a] } : { t: top + " − " + c.a + " = ▢", a: [c.b] })
                              : (hideA ? { t: "▢ + " + c.b + " = " + top, a: [c.a] } : { t: c.a + " + ▢ = " + top, a: [c.b] });
        });
      }
      var T = tensPools(k);
      var cs = m === "tens100" || m === "hundreds1000" ? halves(T.add, T.sub, n)
             : m === "fives" || m === "fives1000" ? halves(F.a0, F.s0, h).concat(halves(F.a5, F.s5, n - h))
             : m === "tensOnly" || m === "hundredsOnly1000" ? halves(S3.ta, S3.ts, n)
             : m === "onesOnly" || m === "tensOnly1000" ? halves(S3.ua, S3.us, n)
             : m === "cross100" || m === "cross1000" ? halves(S4.a, S4.s, n)
             : halves(S5.a0, S5.s0, h).concat(halves(S5.a1, S5.s1, n - h));
      return cs.map(line);
    }
    // the long chains: the app's own longChains(), written out
    function longDeal(n) {
      return longChains(n).map(function (c) { return { t: c.a + " " + c.op + " " + c.b + " " + c.op2 + " " + c.b2 + " = ▢", a: [c.want] }; });
    }
    // „< = >": the app's own cmpCards(), the sign's circle ◯ between the two sides; c20 = within 20's (Lasha 2026-10-27)
    function cmpDeal(n, c20) {
      return cmpCards(n, c20).map(function (c) { return { t: c.a + " " + c.op + " " + c.b + " ◯ " + c.c + " " + c.op2 + " " + c.d, a: [c.want] }; });
    }
    /* several drills on one sheet: even shares, spread so two neighbours never come from the same drill (one holding
       more than half of what is left must go now). One example never comes twice: plain „10 − 3" is a friends card too */
    function mixDeal(srcs, n) {
      var seen = {}, pools = srcs.map(function (f, i) {
        var share = Math.floor(n / srcs.length) + (i < n % srcs.length ? 1 : 0), out = [];
        for (var tries = 0; out.length < share && tries < 20; tries++)
          f(share).forEach(function (q) { if (out.length < share && !seen[q.t]) out.push(q); });
        out.forEach(function (q) { seen[q.t] = 1; });
        return out;
      }), res = [], last = -1;
      for (var left = n; left > 0; left--) {
        var ks = [], i;
        for (i = 0; i < pools.length; i++) if (pools[i].length && i !== last) ks.push(i);
        if (!ks.length) ks = [last];
        var big = ks.filter(function (k) { return pools[k].length * 2 > left; }), from = big.length ? big : ks;
        var k = from[Math.floor(Math.random() * from.length)];
        res.push(pools[k].shift()); last = k;
      }
      return res;
    }

    // the menu's drills (MENU: add · sub · mix · plain · cmp · long · exam). The exam on paper = the app's exam: the six
    // practice drills together, no rule box (Lasha 2026-10-25: „ამობეჭდვა იყოს გამოცდას მორგებული"); the screen opens on
    // it. „Within 20" the same: its menu (MENU20, deal20 — „< = >" too, Lasha 2026-10-27 „3ა"), its exam = the app's
    // (EXAM20), opens on it. The twins the same (MENU_TW, dealTw)
    function modes() { return TOPIC[pr.tp].ms; }
    function chosen() { var m = modes()[pr.drill]; return isExam(m) ? examDrills(m) : [m]; }
    // a drill's name key: „menu_" + mode, except where HELP holds another („crossSub" → „menu_cross_sub")
    function nameKey(m) { return HELP[m] ? HELP[m].n : "menu_" + m; }
    function dealOne(m, n) {
      if (pr.tp === "menu20") return deal20(m, n);
      if (pr.tp === "menuTw") return dealTw(m, n);
      if (pr.tp === "menu100" || pr.tp === "menu1000") return deal100(m, n);
      return m === "plain" ? plainDeal(n) : m === "long" ? longDeal(n) : m === "cmp" ? cmpDeal(n) : friendsDeal(m, n);
    }
    function dealSheet(n) {
      var ms = chosen();
      return ms.length === 1 ? dealOne(ms[0], n) : mixDeal(ms.map(function (m) { return function (k) { return dealOne(m, k); }; }), n);
    }
    // the rule box („Dwóch przyjaciół…" + one solved example) only when every drill on the sheet is a friends drill
    function slogan() {
      return pr.tp === "menu" && chosen().every(function (m) { return m !== "plain" && m !== "long" && m !== "cmp"; }) ? t("r1_rule") : "";
    }
    function fresh() {
      pr.qs = dealSheet(pr.n);
      pr.demo = slogan() ? dealSheet(1)[0] : null;
      if (pr.variant === "vcards" && !NSHEET.canColumn(pr.qs)) pr.variant = "cards";
    }

    // one dropdown per choice, its label inside; the drill gets the full width (its names are long)
    function select(key, label, cur, items) {
      return '<label class="select select-sm w-full' + (key === "drill" ? " col-span-2" : "") + '">' +
        '<span class="label text-xs">' + label + '</span><select data-k="' + key + '">' +
        items.map(function (it) {
          return '<option value="' + it[0] + '"' + (String(it[0]) === String(cur) ? " selected" : "") +
                 (it[2] ? " disabled" : "") + '>' + it[1] + '</option>';
        }).join("") + '</select></label>';
    }
    function render() {
      var col = NSHEET.canColumn(pr.qs);
      $("prOpts").innerHTML =
        select("drill", t("prn_drill"), pr.drill, modes().map(function (m, i) { return [i, t(nameKey(m))]; })) +
        select("n", t("prn_count"), pr.n, COUNTS.map(function (n) { return [n, n]; })) +
        select("variant", t("prn_look"), pr.variant, LOOKS.map(function (v) { return [v, t("prn_look_" + v), v === "vcards" && !col]; })) +
        // drawn like the dropdowns by hand — daisyUI's .input stretches any <input> inside it (the toggle became a bar)
        '<label class="col-span-2 flex items-center gap-3 h-8 px-3 border border-base-content/20 cursor-pointer" style="border-radius:var(--radius-field)">' +
        '<span class="text-xs opacity-60 pr-3 self-stretch flex items-center border-r border-base-content/20">' + t("prn_answers") + '</span>' +
        '<span class="grow text-sm">' + t("prn_answers_on") + '</span>' +
        '<input id="prAns" type="checkbox" class="toggle toggle-sm toggle-primary"' + (pr.answers ? " checked" : "") + '></label>';
      Array.prototype.forEach.call($("prOpts").querySelectorAll("select"), function (el) {
        el.onchange = function () {
          var k = el.dataset.k, v = el.value;
          pr[k] = k === "variant" ? v : +v;
          if (k !== "variant") fresh();               // a new look keeps the same examples; anything else deals anew
          log("print: " + k + " → " + v); render();
        };
      });
      $("prAns").onchange = function () { pr.answers = this.checked; log("print: answers → " + (pr.answers ? "on" : "off")); render(); };
      writeSheet();
    }
    function writeSheet() {
      var name = t(TOPIC[pr.tp].name) + " · " + t(nameKey(modes()[pr.drill])), s = slogan();
      var L = { name: t("sh_name"), date: t("sh_date"), grade: t("sh_grade"), time: t("sh_time"), right: t("sh_right"),
                answers: t("sh_answers"), example: t("sh_example"), round: t("sh_round"), star: t("sh_star") };
      var doc = $("prSheet").contentWindow.document;
      doc.open();
      doc.write(NSHEET.html({ variant: pr.variant, qs: pr.qs, demo: pr.demo, answers: pr.answers, L: L,
                              rule: s ? { name: name, slogan: s } : { name: name } }));
      doc.close();
    }
    // the sheet takes whatever room is left: as wide as the screen, or as tall as the space, whichever runs out first
    function fitPreview() {
      var box = $("prBox"), pv = $("prPv"),
          w = Math.max(60, Math.floor(Math.min(box.clientWidth - 24, (box.clientHeight - 12) * 210 / 297)));
      pv.style.width = w + "px"; pv.style.height = Math.round(w * 297 / 210) + "px";
      $("prSheet").style.transform = "scale(" + (w / 794) + ")";
    }
    new ResizeObserver(fitPreview).observe($("prBox"));

    // shown BEFORE the sheet is written: its fit() cannot measure a hidden page
    // from the other menu than last time: its own drill list, so the choice starts over (its exam)
    function open(tp) {
      if (pr.tp !== tp) { pr.tp = tp; pr.drill = modes().indexOf(TOPIC[tp].exam); }
      prFrom = tp;
      $("prTopic").dataset.t = TOPIC[tp].name; $("prTopic").textContent = t($("prTopic").dataset.t);
      show("print"); fresh(); render(); fitPreview(); log("print: open (" + tp + ")");
    }
    $("toPrint").onclick = function () { open("menu"); };
    $("toPrint20").onclick = function () { open("menu20"); };
    $("toPrintTw").onclick = function () { open("menuTw"); };
    $("toPrint100").onclick = function () { open("menu100"); };
    $("toPrint1000").onclick = function () { open("menu1000"); };
    $("prBack").onclick = function () { goMenuOf(pr.tp); };
    $("prAgain").onclick = function () { fresh(); render(); log("print: new examples"); };
    $("prGo").onclick = function () { log("print: → printer"); $("prSheet").contentWindow.print(); };
  })();
</script>
</body>
